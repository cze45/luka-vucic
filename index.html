.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.gc{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.needle{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}

.list li{display:flex;gap:12px;align-items:flex-start;padding:9px 0}

@media (prefers-reduced-motion:reduce){.vin{animation:none}}
@media (max-width:768px){.lg{width:76px;height:76px;margin:-38px 0 0 -38px}}

.vid{position:relative;flex-direction:column;gap:14px}
.play{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#121212;border:1px solid #1F1F1F;box-shadow:6px 6px 12px #050505,-6px -6px 12px #262626}
